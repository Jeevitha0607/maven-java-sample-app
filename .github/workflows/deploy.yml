
name: Java Maven CI-CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build-test-deploy:

    runs-on: [self-hosted, Linux, X64]

    steps:

      # STEP 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # STEP 3: Build application
      - name: Build Application
        run: mvn clean package -DskipTests

      # STEP 4: Run unit tests
      - name: Run Tests
        run: mvn test

      # STEP 5: Deploy only after successful build and tests
      - name: Deploy to EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR file not found!"
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "mkdir -p ~/maven-app"

          scp -i ~/.ssh/deploy_key "$JAR_FILE" \
            "$EC2_USER@$EC2_HOST:~/maven-app/app.jar"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'cd ~/maven-app &&
             if [ -f app.pid ]; then
               kill "$(cat app.pid)" 2>/dev/null || true
             fi
             nohup java -jar app.jar > app.log 2>&1 &
             echo $! > app.pid'

          rm -f ~/.ssh/deploy_key
          echo "Deployment completed!"
